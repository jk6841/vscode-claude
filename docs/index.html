<p><span class="eyebrow">0부 · 개발 조직 이해하기</span></p>
<h2 id="%EC%BD%94%EB%94%A9%EC%9D%B4%EB%9E%80">코딩이란</h2>
<ul>
<li>코딩은 문서 작성 중 한 종류일 뿐임
<ul>
<li>이 말을 이해해야 <code>claude code</code>/<code>codex</code> 등 AI를 잘 활용할 수 있음</li>
<li>이해하는 사람
<ul>
<li>&quot;나는 코딩을 할 일이 없지만 문서 작성, 업무 자동화에 AI를 이렇게 사용할 수 있겠구나&quot;</li>
</ul>
</li>
<li>이해 못하는 사람
<ul>
<li>&quot;<code>claude codex</code>, <code>codex</code>, <code>github</code>? 이런 건 개발자들이나 쓰는 툴이지. 나는 코딩을 할 일이 없으니 알 필요 없겠네.&quot;</li>
<li>이걸 못 받아들이면 AI의 장점을 누릴 수 없음</li>
</ul>
</li>
</ul>
</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="4" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">

<ul>
<li>why?
<ul>
<li>개발 도구를 만드는 사람들도 <code>개발자</code>들임</li>
<li>개발자들의 사고 방식, 협업 방식, 정서를 이해해야 개발 도구를 더 잘 이해할 수 있음</li>

<p><strong>Word · PowerPoint · Excel, 이메일, 공유 드라이브</strong></p>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="12" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">1부 · VS Code</span></p>
<h1 id="vs-code-%ED%99%94%EB%A9%B4%EC%9D%80-%EB%84%A4-%EC%98%81%EC%97%AD%EB%A7%8C-%EC%95%8C%EB%A9%B4-%EC%8B%9C%EC%9E%91%ED%95%A0-%EC%88%98-%EC%9E%88%EB%8B%A4">VS Code 화면은 네 영역만 알면 시작할 수 있다</h1>
<div class="columns three">
<div class="card accent"><h3>Activity Bar</h3>Explorer<br />Search<br />Source Control<br />Run and Debug</div>
<div class="card"><h3>Editor</h3>코드 · Notebook · Diff<br />여러 파일을 탭으로 비교</div>
<div class="card"><h3>Terminal</h3>프로젝트 루트에서<br />명령과 테스트 실행</div>
</div>
<blockquote>
<p>상태 표시줄에서는 브랜치, Python 인터프리터, 오류 상태를 확인한다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="13" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">1부 · VS Code</span></p>
<h1 id="%ED%8C%8C%EC%9D%BC-%ED%95%98%EB%82%98%EA%B0%80-%EC%95%84%EB%8B%88%EB%9D%BC-workspace%EB%A5%BC-%EC%97%B0%EB%8B%A4">파일 하나가 아니라 Workspace를 연다</h1>
<div class="columns two">
<div>
<pre><code class="language-bash"><span class="hljs-built_in">cd</span> my-project
code .
</code></pre>
</div>
<div class="card accent">
<h3 id="my-project">my-project/</h3>
<p><code>data/</code> · <code>notebooks/</code> · <code>src/</code><br />
<code>tests/</code> · <code>README.md</code></p>
</div>
</div>
<ul>
<li>터미널의 현재 폴더와 프로젝트 루트를 맞춘다.</li>
<li>원본 데이터와 생성 결과의 위치를 분리한다.</li>
<li>AI도 이 루트를 기준으로 파일과 지침을 찾는다.</li>
<li>맥락에 따라 <code>project/repository</code> 등으로 지칭하기도 함</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="14" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">1부 · VS Code</span></p>
<h1 id="extension%EC%9D%80-%ED%95%84%EC%9A%94%ED%95%9C-%EB%8A%A5%EB%A0%A5%EB%A7%8C-%EB%8D%94%ED%95%9C%EB%8B%A4">Extension은 필요한 능력만 더한다</h1>
<div class="columns three">
<div class="card accent"><h3>Python</h3>실행 · 디버깅<br />인터프리터 선택</div>
<div class="card"><h3>Formatter</h3>일관된 코드 형식<br />Black · Ruff</div>
<div class="card"><h3>Claude · Codex</h3>프로젝트 안에서<br />에이전트 작업</div>
</div>
<blockquote>
<p>처음부터 많이 설치하지 말고, 실제로 사용할 확장만 준비한다.<br />
신뢰할 수 있는 publisher의 extension만 사용할 것</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="15" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">1부 · VS Code</span></p>
<h1 id="%ED%95%9C-%EB%B2%88%EC%9D%98-%EC%8B%A4%ED%96%89-%EA%B2%BD%EB%A1%9C%EB%A5%BC-%EB%A7%8C%EB%93%A4%EC%96%B4-%EB%91%94%EB%8B%A4">한 번의 실행 경로를 만들어 둔다</h1>
<div class="columns two">
<div>
<pre><code class="language-json"><span class="hljs-punctuation">{</span>
  <span class="hljs-attr">&quot;label&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;Run tests&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;type&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;shell&quot;</span><span class="hljs-punctuation">,</span>
  <span class="hljs-attr">&quot;command&quot;</span><span class="hljs-punctuation">:</span> <span class="hljs-string">&quot;python -m pytest&quot;</span>
<span class="hljs-punctuation">}</span>
</code></pre>
</div>
<div>
<ul>
<li>Task 이름만으로 실행 방법을 찾는다.</li>
<li><code>CLAUDE.md</code>와 <code>AGENTS.md</code>에도 같은 명령을 적는다.</li>
<li>완료 조건을 “테스트 통과”로 구체화한다.</li>
</ul>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-class="section" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" class="section" style="--class:section;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;">
<p><span class="section-no">02</span></p>
<h1 id="git%EC%9D%80-ai-%EC%9E%91%EC%97%85%EC%9D%98-%EC%95%88%EC%A0%84%EB%A7%9D">Git은 AI 작업의 안전망</h1>
<p>변경을 기록하고, 비교하고, 작은 단위로 되돌린다.</p>
<div class="accent-line"></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="17" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">2부 · GitHub</span></p>
<h1 id="git%EC%9D%84-%EC%82%AC%EC%9A%A9%ED%95%B4%EC%95%BC%ED%95%98%EB%8A%94-%EC%9D%B4%EC%9C%A0">Git을 사용해야하는 이유</h1>
<blockquote>
<p>AI들이 Git 중심으로 또는 Git과 강하게 결합하여 동작함.<br />
Git을 사용하지 않으면 AI와 안정적으로 코딩하기 어려움.<br />
AI는 물론 cloud 서비스들도 git을 중심으로 설계됨.<br />
개발 업계의 사실상 표준인 version control system<br />
학부생들도 쓰는데 굳이 이걸 안 배우겠다고 버틸 이유도 없음</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="18" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="18" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">2부 · Git</span></p>
<h1 id="%EC%9E%91%EC%97%85%EC%9D%80-%ED%98%84%EC%9E%AC-%EC%83%81%ED%83%9C-%E2%86%92-%EC%88%98%EC%A0%95-%E2%86%92-%ED%99%95%EC%9D%B8%EC%9D%98-%EB%A3%A8%ED%94%84%EB%8B%A4">작업은 현재 상태 → 수정 → 확인의 루프다</h1>
<div class="flow four">
<div><strong>현재 상태</strong><small>Commit · Branch<br />git status</small></div>
<div><strong>수정</strong><small>사람 또는 AI<br />작은 작업 단위</small></div>
<div><strong>확인</strong><small>Diff · Test<br />의도와 결과 비교</small></div>
<div class="active"><strong>기록</strong><small>Stage · Commit<br />새로운 기준점</small></div>
</div>
<blockquote>
<p>버전 관리는 백업이 아니라 작업 루프를 안정적으로 반복하기 위한 기반이다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-class="question" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" class="question" style="--class:question;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;">
<h1 id="%EB%A7%8C%EC%95%BD-git-%EC%97%86%EC%9D%B4">만약 Git 없이</h1>
<h1 id="ai%EC%99%80-%EC%BD%94%EB%94%A9%ED%95%9C%EB%8B%A4%EB%A9%B4">AI와 코딩한다면?</h1>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="20" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">2부 · Git</span></p>
<h1 id="ai%EA%B0%80-%EB%AC%B4%EC%97%87%EC%9D%84-%EB%B0%94%EA%BF%A8%EB%8A%94%EC%A7%80-%EC%B6%94%EC%A0%81%ED%95%98%EA%B8%B0-%EC%96%B4%EB%A0%B5%EB%8B%A4">AI가 무엇을 바꿨는지 추적하기 어렵다</h1>
<div class="columns three">
<div class="card accent"><b>기준점 부재</b><h3>전과 후를 비교할 수 없다</h3>내 변경과 AI의 변경이 섞이고 원래 상태가 흐려진다.</div>
<div class="card"><b>변경 범위 불명</b><h3>놓치는 파일이 생긴다</h3>코드뿐 아니라 설정, 새 파일, 삭제된 파일도 바뀔 수 있다.</div>
<div class="card"><b>복구 곤란</b><h3>오류만 되돌리기 어렵다</h3>정상 변경과 오류가 섞이면 복구 범위를 판단하기 어렵다.</div>
</div>
<blockquote>
<p>AI의 설명은 보고이고, 실제 변경의 근거는 <strong>Diff</strong>다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="21" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">2부 · Git</span></p>
<h1 id="stage%EB%8A%94-%EC%9D%B4%EB%B2%88-%EC%BB%A4%EB%B0%8B%EC%97%90-%EB%84%A3%EC%9D%84-%EB%B3%80%EA%B2%BD%EC%9D%84-%EA%B3%A0%EB%A5%B4%EB%8A%94-%EB%8B%A8%EA%B3%84%EB%8B%A4">Stage는 ‘이번 커밋에 넣을 변경’을 고르는 단계다</h1>
<div class="columns three">
<div class="card accent"><h3>Changes</h3>아직 선택하지 않은 변경<br />U: 새 파일 · M: 수정</div>
<div class="card"><h3>Staged Changes</h3>다음 커밋에 포함할 변경<br />파일별로 선택</div>
<div class="card"><h3>Commit</h3>의미 있는 기준점<br />무엇과 왜를 기록</div>
</div>
<pre><code class="language-bash">git status        <span class="hljs-comment"># 현재 상태</span>
git diff          <span class="hljs-comment"># 아직 고르지 않은 변경</span>
git diff --staged <span class="hljs-comment"># 다음 커밋에 들어갈 변경</span>
</code></pre>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="22" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">2부 · Git</span></p>
<h1 id="git%EA%B3%BC-github%EB%8A%94-%EA%B0%99%EC%9D%80-%EA%B2%83%EC%9D%B4-%EC%95%84%EB%8B%88%EB%8B%A4">Git과 GitHub는 같은 것이 아니다</h1>
<div class="columns two">
<div class="card accent">
<h3 id="git">Git</h3>
<p>분산 버전 관리 도구<br />
Repository · Diff · Commit · Branch · Merge</p>
</div>
<div class="card">
<h3 id="github">GitHub</h3>
<p>Git 저장소를 호스팅하는 웹 협업 서비스<br />
Pull Request · Review · Issue · Actions</p>
</div>
</div>
<blockquote>
<p>Commit은 내 컴퓨터에 기록된다. Push해야 GitHub에 공유된다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="23" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">2부 · GitHub</span></p>
<h1 id="issue-%E2%86%92-branch-%E2%86%92-pull-request-%E2%86%92-main">Issue → Branch → Pull Request → main</h1>
<div class="flow four">
<div><strong>Issue</strong><small>할 일과 문제<br />담당자 · 완료 조건</small></div>
<div><strong>Branch</strong><small>독립된 작업 공간<br />main과 분리</small></div>
<div><strong>Pull Request</strong><small>Diff · 대화<br />Review · Check</small></div>
<div class="active"><strong>main</strong><small>승인된 변경을<br />공통 기준에 반영</small></div>
</div>
<blockquote>
<p>개발 조직은 파일을 주고받기보다 공용 상태에 작은 변경을 합친다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-class="section" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" class="section" style="--class:section;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;">
<p><span class="section-no">03</span></p>
<h1 id="claude-code%EC%99%80-codex">Claude Code와 Codex</h1>
<p>대답을 받는 도구를 넘어 프로젝트 안에서 계획하고 실행하고 검증한다.</p>
<div class="accent-line"></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="25" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">3부 · 코딩 에이전트</span></p>
<h1 id="%EC%B1%84%ED%8C%85%EC%9C%BC%EB%A1%9C-%EC%BD%94%EB%94%A9%ED%95%98%EB%A9%B4-%EC%99%9C-%EB%B6%88%ED%8E%B8%ED%95%A0%EA%B9%8C">채팅으로 코딩하면 왜 불편할까?</h1>
<div class="flow five">
<div><strong>찾기</strong><small>관련 파일<br />오류 메시지</small></div>
<div><strong>붙여넣기</strong><small>필요한 문맥을<br />채팅으로 전달</small></div>
<div><strong>답변</strong><small>코드 조각과<br />수정 방법</small></div>
<div><strong>복사 · 실행</strong><small>Editor에 반영<br />직접 명령 실행</small></div>
<div class="active"><strong>다시 전달</strong><small>새 오류와 결과를<br />채팅에 복사</small></div>
</div>
<blockquote>
<p>사용자가 프로젝트와 AI 사이의 파일 시스템·터미널·테스트 러너가 된다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="26" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">3부 · 코딩 에이전트</span></p>
<h1 id="%EC%B1%84%ED%8C%85-ai%EC%99%80-%EC%BD%94%EB%94%A9-%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8%EC%9D%98-%ED%95%B5%EC%8B%AC-%EC%B0%A8%EC%9D%B4">채팅 AI와 코딩 에이전트의 핵심 차이</h1>
<div class="columns two">
<div class="card accent">
<h3 id="%EC%B1%84%ED%8C%85-%EC%A4%91%EC%8B%AC">채팅 중심</h3>
<p>질문에 답하고 코드를 제안한다.<br />
복사 · 실행 · 검증은 주로 사용자가 담당한다.</p>
</div>
<div class="card">
<h3 id="%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8-%EC%A4%91%EC%8B%AC">에이전트 중심</h3>
<p>파일을 읽고 수정한다.<br />
명령과 테스트를 실행한다.<br />
Git Diff를 확인하고 결과를 보고한다.</p>
</div>
</div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="27" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">3부 · 코딩 에이전트</span></p>
<h1 id="%EC%BD%94%EB%94%A9-%EC%97%90%EC%9D%B4%EC%A0%84%ED%8A%B8%EB%8A%94-%EC%96%B4%EB%94%94%EA%B9%8C%EC%A7%80-%ED%95%A0-%EC%88%98-%EC%9E%88%EC%9D%84%EA%B9%8C">코딩 에이전트는 어디까지 할 수 있을까?</h1>
<div class="columns three">
<div class="card accent"><b>PROJECT</b><h3>프로젝트 파일</h3>코드와 설정 읽기·수정<br />새 파일 생성·삭제<br />Diff 확인</div>
<div class="card"><b>TERMINAL</b><h3>명령 실행</h3>테스트 · 빌드 · Git<br />실제 파일과 Process에 영향</div>
<div class="card"><b>OUTSIDE</b><h3>경계 밖의 작업</h3>다른 폴더 · 네트워크<br />외부 서비스<br />추가 권한이나 승인</div>
</div>
<blockquote>
<p>권한 확인은 AI가 현재 작업의 경계를 넘기 전에 멈추는 순간이다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="28" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">3부 · 코딩 에이전트</span></p>
<h1 id="mcp%EB%8A%94-ai%EC%99%80-%EC%99%B8%EB%B6%80-%EB%8F%84%EA%B5%AC%EB%A5%BC-%EC%97%B0%EA%B2%B0%ED%95%98%EB%8A%94-%EA%B3%B5%ED%86%B5-%EA%B7%9C%EC%B9%99%EC%9D%B4%EB%8B%A4">MCP는 AI와 외부 도구를 연결하는 공통 규칙이다</h1>
<div class="connector">
<div class="card accent"><h3>AI 에이전트</h3>필요한 작업과 도구를 선택</div>
<strong>→</strong>
<div class="hub">MCP</div>
<strong>→</strong>
<div class="card"><h3>외부 도구</h3>GitHub · Slack · Notion<br />Drive · 데이터베이스</div>
</div>
<blockquote>
<p>MCP는 모델을 더 똑똑하게 만들기보다 보고 사용할 수 있는 도구를 늘린다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="29" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">3부 · 코딩 에이전트</span></p>
<h1 id="%ED%95%A0-%EC%88%98-%EC%9E%88%EB%8A%94-%EA%B2%83%EA%B3%BC-%EB%B0%94%EB%A1%9C-%ED%95%B4%EB%8F%84-%EB%90%98%EB%8A%94-%EA%B2%83%EC%9D%80-%EB%8B%A4%EB%A5%B4%EB%8B%A4">할 수 있는 것과 바로 해도 되는 것은 다르다</h1>
<div class="flow four risk">
<div><strong>읽기</strong><small>대화 · 문서 확인</small></div>
<div><strong>작성</strong><small>초안 · 코드 생성</small></div>
<div><strong>변경</strong><small>기존 내용 수정</small></div>
<div class="active"><strong>중요 작업</strong><small>전송 · 삭제 · 배포</small></div>
</div>
<blockquote>
<p>최소 권한 · 읽기/쓰기 분리 · 중요한 작업은 승인 · 실행 기록 확인</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-class="section" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" class="section" style="--class:section;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;">
<p><span class="section-no">04</span></p>
<h1 id="ai%EB%A5%BC-%EC%9C%84%ED%95%9C-%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8-%EC%84%A4%EB%AA%85%EC%84%9C">AI를 위한 프로젝트 설명서</h1>
<p>매번 설명하지 말고 프로젝트 안에 짧고 검증 가능한 지침을 남긴다.</p>
<div class="accent-line"></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="31" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">4부 · 프로젝트 지침</span></p>
<h1 id="claude-code%EC%99%80-codex%EB%8A%94-%ED%94%84%EB%A1%9C%EC%A0%9D%ED%8A%B8-%EC%84%A4%EB%AA%85%EC%84%9C%EB%A5%BC-%EC%9D%BD%EB%8A%94%EB%8B%A4">Claude Code와 Codex는 프로젝트 설명서를 읽는다</h1>
<div class="columns two">
<div class="card accent">
<h3 id="claude-code">Claude Code</h3>
<p><code>CLAUDE.md</code><br />
프로젝트 또는 상위 범위 지침<br />
더 세분화하면 <code>.claude/</code></p>
</div>
<div class="card">
<h3 id="codex">Codex</h3>
<p><code>AGENTS.md</code><br />
저장소와 하위 디렉터리 지침<br />
더 가까운 문서가 우선</p>
</div>
</div>
<blockquote>
<p>파일 이름은 달라도 목적은 같다: 프로젝트에서 일하고 검증하는 방식을 알려준다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="32" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">4부 · 프로젝트 지침</span></p>
<h1 id="%EC%A7%80%EC%B9%A8%EA%B3%BC-%EC%84%A4%EC%A0%95-%EC%9E%AC%EC%82%AC%EC%9A%A9-%EC%9E%91%EC%97%85%EC%9D%84-%EB%B6%84%EB%A6%AC%ED%95%9C%EB%8B%A4">지침과 설정, 재사용 작업을 분리한다</h1>
<table>
<thead>
<tr>
<th>역할</th>
<th>Claude Code</th>
<th>Codex</th>
</tr>
</thead>
<tbody>
<tr>
<td>프로젝트 지침</td>
<td><code>CLAUDE.md</code></td>
<td><code>AGENTS.md</code></td>
</tr>
<tr>
<td>실행 설정</td>
<td><code>.claude/settings.json</code></td>
<td><code>.codex/config.toml</code></td>
</tr>
<tr>
<td>세부 규칙</td>
<td><code>.claude/rules/</code></td>
<td>하위 <code>AGENTS.md</code></td>
</tr>
<tr>
<td>재사용 작업</td>
<td><code>.claude/skills/</code></td>
<td><code>.agents/skills/</code></td>
</tr>
<tr>
<td>외부 도구</td>
<td><code>.mcp.json</code></td>
<td><code>config.toml</code>의 MCP 설정</td>
</tr>
</tbody>
</table>
<blockquote>
<p>처음에는 지침 파일 하나로 시작하고 반복되는 필요가 생길 때 확장한다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-class="section" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" class="section" style="--class:section;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;">
<p><span class="section-no">05</span></p>
<h1 id="%EA%B0%9C%EB%B0%9C%EC%9D%84-%EB%84%98%EC%96%B4-%EB%B0%9C%ED%91%9C%EC%9E%90%EB%A3%8C-%EB%A7%8C%EB%93%A4%EA%B8%B0">개발을 넘어: 발표자료 만들기</h1>
<p>코딩 에이전트는 코드만 만드는 도구가 아니라 파일 기반 작업을 함께하는 에이전트다.</p>
<div class="accent-line"></div>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="34" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">5부 · 발표자료 만들기</span></p>
<h1 id="%EC%9D%B4-%EB%B0%9C%ED%91%9C%EC%9E%90%EB%A3%8C%EB%8F%84-markdown%EC%9C%BC%EB%A1%9C-%EB%A7%8C%EB%93%A0%EB%8B%A4">이 발표자료도 Markdown으로 만든다</h1>
<div class="columns three">
<div class="card accent"><b>01</b><h3>본문</h3><code>vscode-ai.md</code><br />제목 · 목록 · 표 · 코드</div>
<div class="card"><b>02</b><h3>디자인</h3><code>vscode-ai.css</code><br />색상 · 서체 · 레이아웃</div>
<div class="card"><b>03</b><h3>기준</h3><code>DESIGN.md</code><br />규칙 · 컴포넌트 · 작성법</div>
</div>
<blockquote>
<p>Marp UI에서 Markdown을 수정하면 오른쪽에서 현재 슬라이드를 바로 확인할 수 있다.</p>
</blockquote>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="35" data-paginate="true" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" data-marpit-pagination="35" style="--paginate:true;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;" data-marpit-pagination-total="37">
<p><span class="eyebrow">마무리</span></p>
<h1 id="%EC%8B%9C%EC%9E%91-%EC%B2%B4%ED%81%AC%EB%A6%AC%EC%8A%A4%ED%8A%B8">시작 체크리스트</h1>
<ul>
<li>[ ] Workspace 루트를 열었는가?</li>
<li>[ ] Python 인터프리터와 Kernel이 맞는가?</li>
<li>[ ] 작업 전 Git 상태를 확인했는가?</li>
<li>[ ] Goal · Context · Constraints · Done when이 있는가?</li>
<li>[ ] 계획을 먼저 검토했는가?</li>
<li>[ ] 테스트와 Diff를 직접 확인했는가?</li>
<li>[ ] API 키와 민감 데이터가 빠져 있는가?</li>
</ul>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="36" data-class="question" data-lang="ko" data-theme="wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg" lang="ko" class="question" style="--class:question;--lang:ko;--theme:wrrlevvulom8ftufxylp1wi03iew66sljf221wqw77yg;">
<h1 id="qa">Q&amp;A</h1>
<p>환경을 맞추고 · 안전하게 맡기고 · 검증해서 남긴다</p>
<div class="accent-line"></div>
<p><code>README.md</code> · <code>CLAUDE.md</code> · <code>AGENTS.md</code> · <code>examples/</code></p>
</section>
